x-shadow-image: &shadow-image
  image: ashare-shadow-cockpit:phase8
  build:
    context: .
  init: true
  volumes:
    - type: bind
      source: ./data/pit_csi300/compiled
      target: /app/data/pit_csi300/compiled
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./reports/phase5a_multi_shadow
      target: /app/reports/phase5a_multi_shadow
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./reports/phase6a_vol_and_pit_probe
      target: /app/reports/phase6a_vol_and_pit_probe
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${SHADOW_RUNTIME_DIR:-./deploy-runtime/shadow}
      target: /data/shadow
      bind:
        create_host_path: false

services:
  cockpit:
    <<: *shadow-image
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHASE7A_DIR: /data/shadow
      PHASE7A_API_READ_ONLY: "${PHASE7A_API_READ_ONLY:-1}"
      PHASE7A_HEALTH_PUBLIC: "${PHASE7A_HEALTH_PUBLIC:-1}"
      PHASE7A_SQLITE_TIMEOUT_MS: "${PHASE7A_SQLITE_TIMEOUT_MS:-30000}"
      PHASE7A_ALLOWED_HOSTS: "${PHASE7A_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      PHASE7A_BASIC_AUTH_USER: "${PHASE7A_BASIC_AUTH_USER:-}"
      PHASE7A_BASIC_AUTH_PASS: "${PHASE7A_BASIC_AUTH_PASS:-}"
      PHASE7A_TRUST_PROXY_HEADERS: "${PHASE7A_TRUST_PROXY_HEADERS:-0}"
      PHASE7A_UVICORN_FORWARDED_ALLOW_IPS: "${PHASE7A_UVICORN_FORWARDED_ALLOW_IPS:-}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  worker:
    <<: *shadow-image
    profiles: [ops]
    entrypoint: ["bash", "deploy/run_daily_shadow.sh"]
    command: ["Healthcheck"]
    healthcheck:
      disable: true
    environment:
      PHASE7A_DIR: /data/shadow
      PHASE7A_SQLITE_WAL: "${PHASE7A_SQLITE_WAL:-0}"
      TUSHARE_TOKEN: "${TUSHARE_TOKEN:-}"
      TUSHARE_HTTP_URL: "${TUSHARE_HTTP_URL:-}"
      SHADOW_NOTIFY_WEBHOOK_URL: "${SHADOW_NOTIFY_WEBHOOK_URL:-}"
      SHADOW_NOTIFY_DRY_RUN: "${SHADOW_NOTIFY_DRY_RUN:-0}"
      SHADOW_SMTP_HOST: "${SHADOW_SMTP_HOST:-}"
      SHADOW_SMTP_PORT: "${SHADOW_SMTP_PORT:-587}"
      SHADOW_SMTP_USER: "${SHADOW_SMTP_USER:-}"
      SHADOW_SMTP_PASS: "${SHADOW_SMTP_PASS:-}"
      SHADOW_SMTP_FROM: "${SHADOW_SMTP_FROM:-}"
      SHADOW_SMTP_TO: "${SHADOW_SMTP_TO:-}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
